spring.application.name=adega

# Configurações do Tomcat / Portas
server.port=8080
server.address=0.0.0.0

# -------------------------------------------------------------
# CONFIGURAÇÃO DO BANCO DE DADOS (Mapeado para as suas variáveis do .env)
# -------------------------------------------------------------
# O Spring vai ler a URL completa que você colocar no painel do Render
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Como o banco físico real do Render é Postgres, usamos o Driver e Dialeto dele
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# -------------------------------------------------------------

# Configurações do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações para Docker (X-Forwarded)
server.forward-headers-strategy=native

# Configurações de SSL/HTTPS
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:123456}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=adega

# Mapeia o segredo do JWT para a variável que você pediu
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}