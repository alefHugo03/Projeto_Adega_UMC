spring.application.name=adega

# Carrega variáveis do arquivo .env, seja no diretório atual ou no diretório pai
spring.config.import=optional:dotenv:./.env,optional:dotenv:../.env

# Porta e endereço padrão para ambiente web
server.port=${API_HTTPS_PORT:8443}
server.address=0.0.0.0
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat
server.http.port=${API_HTTP_PORT:8080}

# -------------------------------------------------------------
# CONFIGURAÇÃO PARA USAR MYSQL
# -------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_HOST:3307}/${MYSQL_DATABASE:adega_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${MYSQL_USER:adega_user}
spring.datasource.password=${MYSQL_PASSWORD:adega_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# -------------------------------------------------------------

# Configurações do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações para Docker (X-Forwarded)
server.forward-headers-strategy=native

# Mapeamento do segredo JWT vindo do ambiente
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:segredo_local_para_desenvolvimento_2024}