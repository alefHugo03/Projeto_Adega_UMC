spring.application.name=adega
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE:adega_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${MYSQL_USER:adega_user}
spring.datasource.password=${MYSQL_PASSWORD:adega_password}
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:minhasenhamuitosecreta123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=8443
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações de SSL/HTTPS
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:123456}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=adega
server.ssl.enabled=true
server.http.port=8080
