spring.application.name=adega

# REMOVA ou comente qualquer linha que force o profile 'dev' como esta:
# spring.profiles.active=dev

# Configurações do Tomcat / Portas
server.port=8080
server.address=0.0.0.0

# Configurações do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações para Docker (X-Forwarded)
server.forward-headers-strategy=native

# Configurações de SSL/HTTPS
server.ssl.enabled=true
# Garantimos o uso do arquivo no classpath ou raiz do jar
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:123456}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=adega