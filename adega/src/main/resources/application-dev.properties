# Banco de dados local (Acessando o container do MySQL pelo Windows)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_HOST:3307}/${MYSQL_DATABASE:adega_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${MYSQL_USER:adega_user}
spring.datasource.password=${MYSQL_PASSWORD:suasenha_user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Segredo do JWT para rodar localmente sem precisar configurar variáveis na IDE
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:segredo_local_para_desenvolvimento_2024}