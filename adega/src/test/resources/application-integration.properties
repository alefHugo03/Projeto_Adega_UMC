spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${MYSQL_DATABASE:adega_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:adega_user}
spring.datasource.password=${MYSQL_PASSWORD:adega_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:minhasenhamuitosecreta123}

# Disable SSL for integration tests to avoid needing keystore in CI
server.ssl.enabled=false
# Run integration tests on HTTP port 8080
server.port=8080
